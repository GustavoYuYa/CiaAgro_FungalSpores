experiment:
  name: M4
  description: "SimpleViT with weighted random sampler, data augmentation and train set mixed - normal images and segmented images with gaussian noise stochastic background"

model:
  image_size: 64
  num_classes: 3

  patch_size: 4
  dim: 256
  depth: 4
  heads: 16
  dim_head: 16
  mlp_dim: 512

training:
  batch_size: 64
  epochs: 100
  warmup_epochs: 20

  learning_rate: 0.00017387407693060297
  weight_decay: 0.05

data:
  condition: "mixed"
  weighted_sampler: true
  augmentation: true
  noise_background:
    enabled: true
    deterministic_train: false
    deterministic_validation: true
    determinitisc_test: true
    distributions: "- normal_0.5_0.2"
  mixed_training: true

normalization:
  method:
  mean:
  std:

seed: 42